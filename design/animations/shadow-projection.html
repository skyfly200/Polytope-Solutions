<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Projection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Sirin+Stencil&display=swap" rel="stylesheet">
    <style>
        /* Polytope Solutions site palette: black ground, white type,
           deep violet primary and amber secondary (from src/plugins/vuetify.ts) */
        :root {
            --ink: #ffffff;
            --bg: #000000;
            --panel: #0d0b14;
            --primary: #4527a0;
            --primary-hover: #5b3bc0;
            --primary-light: #7e57c2;
            --secondary: #ffa000;
            --secondary-hover: #ffb733;
            --muted: #8d8a99;
            --line: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--ink);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 24px;
            border-radius: 12px;
            align-self: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Sirin Stencil', cursive;
            font-size: 36px;
            font-weight: 400;
            color: var(--ink);
            margin-bottom: 6px;
            line-height: 1.1;
        }

        .sidebar .subtitle {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.4;
            letter-spacing: 0.02em;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 28px;
        }

        .control-section h3 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--secondary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: #000;
            color: var(--ink);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--line);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 2px rgba(255, 160, 0, 0.15);
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--line);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--secondary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: var(--secondary-hover);
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--secondary);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--muted);
            min-width: 48px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 14px;
        }

        .color-group label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--muted);
        }

        /* Buttons */
        .button {
            background: var(--primary);
            color: var(--ink);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-family: 'Rajdhani', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--secondary);
            color: #000;
        }

        .button.secondary:hover {
            background: var(--secondary-hover);
        }

        .button.tertiary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
        }

        .button.tertiary:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--line);
            box-shadow: 0 0 80px rgba(69, 39, 160, 0.25);
            background: var(--bg);
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            font-size: 18px;
            color: var(--muted);
        }

        /* Responsive - stack on small screens */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                padding: 16px;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Shadow Projection</h1>
            <div class="subtitle">A hidden four-dimensional figure, seen only through its shadow.</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Points</label>
                    <div class="slider-container">
                        <input type="range" id="pointCount" min="40" max="400" step="10" value="140" oninput="updateParam('pointCount', this.value)">
                        <span class="value-display" id="pointCount-value">140</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Links per Point</label>
                    <div class="slider-container">
                        <input type="range" id="neighbors" min="2" max="8" step="1" value="4" oninput="updateParam('neighbors', this.value)">
                        <span class="value-display" id="neighbors-value">4</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>4D Depth</label>
                    <div class="slider-container">
                        <input type="range" id="depth" min="2.2" max="6" step="0.1" value="3" oninput="updateParam('depth', this.value)">
                        <span class="value-display" id="depth-value">3.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Rotation Speed</label>
                    <div class="slider-container">
                        <input type="range" id="speed" min="0" max="2" step="0.05" value="0.35" oninput="updateParam('speed', this.value)">
                        <span class="value-display" id="speed-value">0.35</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Fade</label>
                    <div class="slider-container">
                        <input type="range" id="fade" min="0.02" max="0.4" step="0.01" value="0.12" oninput="updateParam('fade', this.value)">
                        <span class="value-display" id="fade-value">0.12</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Far (Receding Violet)</label>
                    <div class="color-picker-container">
                        <input type="color" id="farColor" value="#7e57c2" onchange="updateColor('farColor', this.value)">
                        <span class="color-value" id="farColor-value">#7e57c2</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Near (Amber)</label>
                    <div class="color-picker-container">
                        <input type="color" id="nearColor" value="#ffa000" onchange="updateColor('nearColor', this.value)">
                        <span class="color-value" id="nearColor-value">#ffa000</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <button class="button" onclick="regenerate()" style="margin-bottom: 8px;">↻ Regenerate</button>
                <div class="button-row">
                    <button class="button tertiary" onclick="resetParameters()">Reset</button>
                    <button class="button tertiary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Projecting…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // PARAMETERS — the viewer's lens. Seeds choose the figure itself.
        // ═══════════════════════════════════════════════════════════════════════

        const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

        let params = {
            seed: 12345,
            pointCount: 140,      // points on the 3-sphere in 4D
            neighbors: 4,         // 4D nearest-neighbour links per point
            depth: 3.0,           // distance of the 4D camera (larger = gentler perspective)
            speed: REDUCED_MOTION ? 0 : 0.35,
            fade: 0.12,           // per-frame fade toward black (smaller = longer trails)
            farColor: '#7e57c2',
            nearColor: '#ffa000'
        };

        let defaultParams = { ...params };

        // ═══════════════════════════════════════════════════════════════════════
        // GEOMETRY — the hidden 4D figure and how its shadow is cast
        // ═══════════════════════════════════════════════════════════════════════

        const CANVAS_SIZE = 1000;
        const CAMERA_3D = 4.0;   // distance of the 3D viewer along z
        const SCALE = 340;       // overall size of the projected figure in px
        const TILT = 0.3;        // fixed pitch so the 3D reading is always legible

        let pts = [];            // points on the unit 3-sphere in 4D: [x, y, z, w]
        let edges = [];          // [i, j, length4D] — the hidden graph, fixed for a seed
        let maxEdge = 1;
        let planeRate = [1, 0.618, 0.27];   // XW, YZ, ZW rotation rates (seeded)
        let planeOffset = [0, 0, 0];        // phase offsets (seeded)
        let t = 0;                          // accumulated time
        let viewYaw = 0;
        let viewPitch = 0;
        let farRGB = [126, 87, 194];
        let nearRGB = [255, 160, 0];

        function setup() {
            let canvas = createCanvas(CANVAS_SIZE, CANVAS_SIZE);
            canvas.parent('canvas-container');
            pixelDensity(Math.min(2, displayDensity()));
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            // Each seed turns the figure at its own cadence of incommensurate rates.
            planeRate = [1, random(0.5, 0.85), random(0.15, 0.45)];
            planeOffset = [random(TWO_PI), random(TWO_PI), random(TWO_PI)];

            // Uniform scatter on the 3-sphere: normalised Gaussian vectors in 4D.
            pts = [];
            for (let i = 0; i < params.pointCount; i++) {
                let v = [randomGaussian(), randomGaussian(), randomGaussian(), randomGaussian()];
                let m = Math.hypot(v[0], v[1], v[2], v[3]);
                pts.push(v.map(c => c / m));
            }

            buildGraph();
            farRGB = hexToRgb(params.farColor);
            nearRGB = hexToRgb(params.nearColor);
            t = 0;
            background(0);
        }

        // The hidden graph: links between 4D nearest neighbours. Rotations are
        // isometries, so this graph never changes for a given seed.
        function buildGraph() {
            edges = [];
            const n = pts.length;
            const k = params.neighbors;
            const seen = new Set();
            for (let i = 0; i < n; i++) {
                let d = [];
                for (let j = 0; j < n; j++) {
                    if (j !== i) d.push([dist4(pts[i], pts[j]), j]);
                }
                d.sort((a, b) => a[0] - b[0]);
                for (let m = 0; m < k && m < d.length; m++) {
                    const j = d[m][1];
                    const key = Math.min(i, j) * 100000 + Math.max(i, j);
                    if (!seen.has(key)) {
                        seen.add(key);
                        edges.push([i, j, d[m][0]]);
                    }
                }
            }
            maxEdge = 1e-9;
            for (const e of edges) maxEdge = Math.max(maxEdge, e[2]);
        }

        function dist4(a, b) {
            const dx = a[0] - b[0], dy = a[1] - b[1], dz = a[2] - b[2], dw = a[3] - b[3];
            return Math.sqrt(dx * dx + dy * dy + dz * dz + dw * dw);
        }

        // Three rotations, one in each pair of orthogonal planes of 4D: XW, YZ, ZW.
        function rotate4(p, a, b, c) {
            let x = p[0], y = p[1], z = p[2], w = p[3];
            const ca = Math.cos(a), sa = Math.sin(a);
            const cb = Math.cos(b), sb = Math.sin(b);
            const cc = Math.cos(c), sc = Math.sin(c);

            let nx = x * ca - w * sa;
            let nw = x * sa + w * ca;
            x = nx; w = nw;

            let ny = y * cb - z * sb;
            let nz = y * sb + z * cb;
            y = ny; z = nz;

            let nz2 = z * cc - w * sc;
            let nw2 = z * sc + w * cc;
            z = nz2; w = nw2;

            return [x, y, z, w];
        }

        // 4D → 3D perspective, a view turn, 3D → 2D perspective, then screen space.
        function projectAll(A, B, C, yaw, pitch) {
            const cy = Math.cos(yaw), sy = Math.sin(yaw);
            const cp = Math.cos(pitch), sp = Math.sin(pitch);
            const D4 = params.depth;
            const out = new Array(pts.length);

            for (let i = 0; i < pts.length; i++) {
                let [x, y, z, w] = rotate4(pts[i], A, B, C);

                const k4 = D4 / (D4 - w);
                x *= k4; y *= k4; z *= k4;

                const x2 = x * cy + z * sy;
                const z2 = -x * sy + z * cy;
                const y2 = y * cp - z2 * sp;
                const z3 = y * sp + z2 * cp;

                const k3 = CAMERA_3D / (CAMERA_3D - z3);
                out[i] = {
                    x: width / 2 + x2 * k3 * SCALE,
                    y: height / 2 + y2 * k3 * SCALE,
                    w: w,      // the hidden coordinate, kept for colour and weight
                    k: k3
                };
            }
            return out;
        }

        function draw() {
            const dt = Math.min(deltaTime, 50) / 1000;
            t += dt * params.speed * 2;

            // Trails: fade the previous frame toward black instead of clearing it.
            noStroke();
            fill(0, params.fade * 255);
            rect(0, 0, width, height);

            // Cursor over the canvas turns the view; otherwise a slow sway.
            const inside = mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height;
            const targetYaw = inside ? (mouseX / width - 0.5) * 1.2 : Math.sin(t * 0.05) * 0.25;
            const targetPitch = inside ? (mouseY / height - 0.5) * 0.8 : 0;
            viewYaw += (targetYaw - viewYaw) * Math.min(1, dt * 2);
            viewPitch += (targetPitch - viewPitch) * Math.min(1, dt * 2);

            const A = t * planeRate[0] + planeOffset[0];
            const B = t * planeRate[1] + planeOffset[1];
            const C = t * planeRate[2] + planeOffset[2];

            const P = projectAll(A, B, C, viewYaw, TILT + viewPitch);

            // Links: colour and brightness follow the hidden depth; long links recede.
            strokeWeight(1);
            for (const [i, j, len] of edges) {
                const a = P[i], b = P[j];
                const f = ((a.w + b.w) / 2 + 1) / 2;          // 0 far … 1 near
                const shade = 1 - 0.55 * (len / maxEdge);
                const c = mixRGB(farRGB, nearRGB, f);
                stroke(c[0], c[1], c[2], (40 + 150 * f) * shade);
                line(a.x, a.y, b.x, b.y);
            }

            // Points: the figure's vertices, sized by perspective.
            noStroke();
            for (const p of P) {
                const f = (p.w + 1) / 2;
                const c = mixRGB(farRGB, nearRGB, f);
                fill(c[0], c[1], c[2], 90 + 165 * f);
                circle(p.x, p.y, (1.5 + 3.5 * f) * p.k);
            }
        }

        function mixRGB(a, b, f) {
            return [
                a[0] + (b[0] - a[0]) * f,
                a[1] + (b[1] - a[1]) * f,
                a[2] + (b[2] - a[2]) * f
            ];
        }

        function hexToRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function formatVal(name, v) {
            if (name === 'pointCount' || name === 'neighbors') return String(v);
            if (name === 'depth') return v.toFixed(1);
            return v.toFixed(2);
        }

        function updateParam(name, value) {
            params[name] = (name === 'pointCount' || name === 'neighbors')
                ? parseInt(value, 10)
                : parseFloat(value);
            document.getElementById(name + '-value').textContent = formatVal(name, params[name]);

            if (name === 'pointCount') {
                initializeSystem();
            } else if (name === 'neighbors') {
                buildGraph();
                background(0);
            }
        }

        function updateColor(colorId, value) {
            params[colorId] = value;
            document.getElementById(colorId + '-value').textContent = value;
            farRGB = hexToRgb(params.farColor);
            nearRGB = hexToRgb(params.nearColor);
        }

        function syncControls() {
            for (const key of ['pointCount', 'neighbors', 'depth', 'speed', 'fade']) {
                document.getElementById(key).value = params[key];
                document.getElementById(key + '-value').textContent = formatVal(key, params[key]);
            }
            for (const key of ['farColor', 'nearColor']) {
                document.getElementById(key).value = params[key];
                document.getElementById(key + '-value').textContent = params[key];
            }
        }

        function regenerate() {
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('shadow-projection-seed-' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = { ...defaultParams, seed: params.seed };
            syncControls();
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function () {
            updateSeedDisplay();
            syncControls();
        });
    </script>
</body>
</html>
